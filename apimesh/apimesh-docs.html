      const SWAGGER_FILE = "swagger.json";

      // Check if swagger data is embedded (to avoid CORS issues)
      const USE_EMBEDDED_DATA = typeof EMBEDDED_SWAGGER_DATA !== "undefined";

      function getSwaggerFilePath() {
        // Try to get the swagger.json path relative to this HTML file
        // If running from Docker, it should be in the same directory
        const currentPath = window.location.pathname;
        const htmlDir = currentPath.substring(0, currentPath.lastIndexOf("/"));
        return htmlDir + "/" + SWAGGER_FILE;
      }

      function truncateText(text, maxLength) {
        if (!text) return "";
        if (text.length <= maxLength) return text;
        return text.substring(0, maxLength) + "...";
      }

      function getAuthorizationRequired(authorizationTag) {
        if (!authorizationTag) return "N/A";
        return authorizationTag === "Authorization Required" ? "Yes" : "No";
      }

      function getSensitiveInformation(sensitiveInfo) {
        if (sensitiveInfo === undefined || sensitiveInfo === null) return "N/A";
        return sensitiveInfo === true ? "Yes" : "No";
      }

      function formatTimestamp(timestamp) {
        if (!timestamp) return null;

        try {
          // Try to parse as ISO date string
          const date = new Date(timestamp);
          if (isNaN(date.getTime())) return timestamp; // Return as-is if not a valid date

          // Format as: "Jan 15, 2024 at 3:45 PM"
          const options = {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "numeric",
            minute: "2-digit",
            hour12: true,
          };
          return date.toLocaleString("en-US", options);
        } catch (e) {
          return timestamp; // Return as-is if parsing fails
        }
      }

      function displayMetadata(swaggerData) {
        // Try multiple possible locations for timestamp
        let timestamp =
          swaggerData.generated_at ||
          swaggerData.timestamp ||
          swaggerData.generatedAt ||
          (swaggerData.info && swaggerData.info.generated_at) ||
          (swaggerData.info && swaggerData.info.timestamp) ||
          (swaggerData.info && swaggerData.info.generatedAt);

        // Try multiple possible locations for commit reference
        let commitRef =
          swaggerData.commit_reference ||
          swaggerData.commit ||
          swaggerData.commitReference ||
          (swaggerData.info && swaggerData.info.commit_reference) ||
          (swaggerData.info && swaggerData.info.commit) ||
          (swaggerData.info && swaggerData.info.commitReference);

        // Try multiple possible locations for GitHub repo URL
        let githubRepoUrl =
          swaggerData.github_repo_url ||
          swaggerData.githubRepoUrl ||
          (swaggerData.info && swaggerData.info.github_repo_url) ||
          (swaggerData.info && swaggerData.info.githubRepoUrl);

        // Display timestamp if available
        if (timestamp) {
          const formattedTimestamp = formatTimestamp(timestamp);
          document.getElementById("timestampValue").textContent =
            formattedTimestamp;
          document.getElementById("timestampMeta").style.display = "flex";
        }

        // Display commit reference if available
        if (commitRef) {
          const commitValueEl = document.getElementById("commitValue");
          
          // If GitHub repo URL is available, make it a clickable link
          if (githubRepoUrl && commitRef) {
            const commitUrl = `${githubRepoUrl}/commits/${commitRef}`;
            commitValueEl.innerHTML = `<a href="${escapeHtml(commitUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(commitRef.substring(0, 7))}</a>`;
          } else {
            commitValueEl.textContent = commitRef;
          }
          
          document.getElementById("commitMeta").style.display = "flex";
        }
      }

      function parseSwagger(swaggerData) {
        const apis = [];
        const paths = swaggerData.paths || {};

        Object.keys(paths).forEach((path) => {
          const pathItem = paths[path];
          const methods = [
            "get",
            "post",
            "put",
            "patch",
            "delete",
            "options",
            "head",
          ];

          methods.forEach((method) => {
            if (pathItem[method]) {
              const operation = pathItem[method];

              apis.push({
                method: method.toUpperCase(),
                path: path,
                summary: operation.summary || "",
                api_description: operation.api_description || "",
                authorization_tag: operation.authorization_tag || "",
                module_tag: operation.module_tag || "",
                sensitive_information: operation.sensitive_information !== undefined ? operation.sensitive_information : null,
              });
            }
          });
        });

        return apis;
      }

      function renderTable(apis) {
        const tbody = document.getElementById("apiTableBody");
        tbody.innerHTML = "";

        if (apis.length === 0) {
          document.getElementById("noResults").style.display = "block";
          document.getElementById("apiTable").style.display = "none";
          return;
        }

        document.getElementById("noResults").style.display = "none";
        document.getElementById("apiTable").style.display = "table";

        apis.forEach((api) => {
          const row = document.createElement("tr");
          const truncatedDescription = truncateText(api.api_description, 100);
          const authorizationRequired = getAuthorizationRequired(
            api.authorization_tag
          );
          const sensitiveInfo = getSensitiveInformation(api.sensitive_information);
          const isTruncated =
            api.api_description && api.api_description.length > 100;

          // Build description HTML with tooltip if truncated
          let descriptionHtml = "";
          if (truncatedDescription) {
            if (isTruncated) {
              descriptionHtml = `
                            <div class="description-container" style="display: inline-block;">
                                <div style="font-size: 0.9em; color: #212732; line-height: 1.4;">${escapeHtml(
                                  truncatedDescription
                                )}</div>
                                <div class="tooltip">${escapeHtml(
                                  api.api_description
                                )}</div>
                            </div>
                        `;
            } else {
              descriptionHtml = `<div style="font-size: 0.9em; color: #212732; line-height: 1.4;">${escapeHtml(
                truncatedDescription
              )}</div>`;
            }
          }

          row.innerHTML = `
                    <td>
                        <span class="method-badge method-${api.method.toLowerCase()}">${
            api.method
          }</span>
                    </td>
                    <td>

                    <td>

                        }
                        ${descriptionHtml}
                    </td>
                    <td>
                        <span class="${
                          authorizationRequired === "Yes"
                            ? "auth-yes"
                            : authorizationRequired === "No"
                            ? "auth-no"
                            : "auth-na"
                        }">${escapeHtml(authorizationRequired)}</span>
                    </td>
                    <td>
                        <span class="${
                          sensitiveInfo === "Yes"
                            ? "auth-yes"
                            : sensitiveInfo === "No"
                            ? "auth-no"
                            : "auth-na"
                        }">${escapeHtml(sensitiveInfo)}</span>
                    </td>
                    <td>
                        ${escapeHtml(api.module_tag)}
                    </td>
                `;
          tbody.appendChild(row);
        });
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      function getSelectedValue(selectElement) {
        return selectElement.value || "";
      }

      function filterAPIs(apis, searchTerm, filters) {
        let filtered = apis;

        // Apply search filter
        if (searchTerm) {
          const term = searchTerm.toLowerCase();
          filtered = filtered.filter(
            (api) =>
              api.method.toLowerCase().includes(term) ||
              api.path.toLowerCase().includes(term) ||
              (api.summary && api.summary.toLowerCase().includes(term)) ||
              (api.api_description &&
                api.api_description.toLowerCase().includes(term)) ||
              (api.module_tag && api.module_tag.toLowerCase().includes(term))
          );
        }

        // Apply method filter
        if (filters.method && filters.method !== "") {
          filtered = filtered.filter((api) => api.method === filters.method);
        }

        // Apply authorization filter
        if (filters.auth && filters.auth !== "") {
          filtered = filtered.filter((api) => {
            const authRequired = getAuthorizationRequired(
              api.authorization_tag
            );
            return authRequired === filters.auth;
          });
        }

        // Apply module filter
        if (filters.module && filters.module !== "") {
          filtered = filtered.filter((api) => {
            if (!api.module_tag) return false;
            return api.module_tag === filters.module;
          });
        }

        // Apply sensitive information filter
        if (filters.sensitiveInfo && filters.sensitiveInfo !== "") {
          filtered = filtered.filter((api) => {
            const sensitiveInfo = getSensitiveInformation(api.sensitive_information);
            return sensitiveInfo === filters.sensitiveInfo;
          });
        }

        return filtered;
      }

      function populateDynamicFilters(apis) {
        // Extract unique modules
        const modules = new Set();
        apis.forEach((api) => {
          if (api.module_tag) {
            modules.add(api.module_tag);
          }
        });
        const moduleSelect = document.getElementById("moduleFilter");
        const currentModuleValue = moduleSelect.value; // Preserve current selection
        moduleSelect.innerHTML = '<option value="">All</option>';
        Array.from(modules)
          .sort()
          .forEach((module) => {
            const option = document.createElement("option");
            option.value = module;
            option.textContent = module;
            moduleSelect.appendChild(option);
          });
        // Restore previous selection if it still exists
        if (
          currentModuleValue &&
          Array.from(modules).includes(currentModuleValue)
        ) {
          moduleSelect.value = currentModuleValue;
        }
      }

      function updateStats(allApis, filteredApis) {
        const total = allApis.length;
        const filtered = filteredApis.length;

        // Calculate authorization stats
        const authRequired = allApis.filter((api) => {
          const authTag = api.authorization_tag || "";
          return authTag === "Authorization Required";
        }).length;

        const noAuth = total - authRequired;

        // Calculate percentages
        const totalPercent = total > 0 ? Math.round((total / total) * 100) : 0;
        const authRequiredPercent =
          total > 0 ? Math.round((authRequired / total) * 100) : 0;
        const noAuthPercent =
          total > 0 ? Math.round((noAuth / total) * 100) : 0;
        const filteredPercent =
          total > 0 ? Math.round((filtered / total) * 100) : 0;

        // Update summary cards
        document.getElementById("totalApisCard").textContent = total;
        document.getElementById("totalApisPercent").textContent =
          totalPercent + "%";

        document.getElementById("authRequiredCard").textContent = authRequired;
        document.getElementById("authRequiredPercent").textContent =
          authRequiredPercent + "%";

        document.getElementById("noAuthCard").textContent = noAuth;
        document.getElementById("noAuthPercent").textContent =
          noAuthPercent + "%";

        document.getElementById("filteredApisCard").textContent = filtered;
        document.getElementById("filteredApisPercent").textContent =
          filteredPercent + "%";
      }

      async function loadSwagger() {
        const loadingEl = document.getElementById("loading");
        const errorEl = document.getElementById("error");
        const tableEl = document.getElementById("apiTable");

        loadingEl.style.display = "block";
        errorEl.style.display = "none";
        tableEl.style.display = "none";

        try {
          let swaggerData;

          // Use embedded data if available (avoids CORS issues)
          if (USE_EMBEDDED_DATA) {
            swaggerData = EMBEDDED_SWAGGER_DATA;
          } else {
            // Fallback to fetching from file (may have CORS issues)
            const swaggerPath = getSwaggerFilePath();
            const response = await fetch(swaggerPath + "?t=" + Date.now());

            if (!response.ok) {
              throw new Error(
                `Failed to load swagger.json: ${response.status} ${response.statusText}`
              );
            }

            swaggerData = await response.json();
          }

          allApisData = parseSwagger(swaggerData);

          // Display metadata (timestamp and commit reference)
          displayMetadata(swaggerData);

          // Populate dynamic filters (module)
          populateDynamicFilters(allApisData);

          // Apply filters and render
          applyFilters();

          loadingEl.style.display = "none";
        } catch (error) {
          loadingEl.style.display = "none";
          errorEl.style.display = "block";

          // Check if it's a CORS error (file:// protocol)
          const isFileProtocol = window.location.protocol === "file:";
          const isCorsError =
            error.message.includes("CORS") ||
            error.message.includes("fetch") ||
            (isFileProtocol && error.name === "TypeError");

          if (isCorsError || isFileProtocol) {
            const htmlDir = window.location.pathname.substring(
              0,
              window.location.pathname.lastIndexOf("/")
            );
            const htmlFileName = window.location.pathname.split("/").pop();
            errorEl.innerHTML = `

                    `;
          } else {

      // Store APIs globally for filtering
      let allApisData = [];

      function applyFilters() {
        if (allApisData.length === 0) return;

        const searchTerm = document.getElementById("searchBox").value;
        const filters = {
          method: getSelectedValue(document.getElementById("methodFilter")),
          auth: getSelectedValue(document.getElementById("authFilter")),
          module: getSelectedValue(document.getElementById("moduleFilter")),
          sensitiveInfo: getSelectedValue(document.getElementById("sensitiveInfoFilter")),
        };

        const filteredApis = filterAPIs(allApisData, searchTerm, filters);
        renderTable(filteredApis);
        updateStats(allApisData, filteredApis);
      }

      // Search functionality
      document
        .getElementById("searchBox")
        .addEventListener("input", applyFilters);

      // Filter event listeners
      document
        .getElementById("methodFilter")
        .addEventListener("change", applyFilters);
      document
        .getElementById("authFilter")
        .addEventListener("change", applyFilters);
      document
        .getElementById("moduleFilter")
        .addEventListener("change", applyFilters);
      document
        .getElementById("sensitiveInfoFilter")
        .addEventListener("change", applyFilters);

      // Initial load
      loadSwagger();
    </script>
  </body>
</html>
